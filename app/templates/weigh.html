<script>
  const wi = document.getElementById('weightInput');
  const lw = document.getElementById('liveWeight');
  const s  = document.getElementById('stable');
  const ss = document.getElementById('scaleStatus');

  // وقتی کاربر تایپ می‌کند، عدد سمت راست هم همان را نشان بده
  wi.addEventListener('input', () => {
    lw.textContent = wi.value ? wi.value : '0';
  });

  async function refreshWeight() {
    try {
      const r = await fetch('/api/scale/weight');
      const d = await r.json();

      // فقط وقتی کاربر داخل input تایپ نمی‌کند، وزن باسکول را نمایش بده
      if (document.activeElement !== wi) {
        lw.textContent = (d.weight ?? 0);
      }

      ss.textContent = 'SCALE: ' + (d.scale_id ?? 'SCALE-01');

      s.textContent = d.stable ? '🟢 STABLE' : '🟡 WAITING';
      s.className = d.stable ? 'stable' : 'unstable';

    } catch (e) {}
  }

  setInterval(refreshWeight, 1000);
  refreshWeight();
</script>
